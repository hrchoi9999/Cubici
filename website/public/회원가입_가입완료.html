<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--css-->
  <link href="./static/fonts/fonts.css" type="text/css" rel="stylesheet">
  <link href="./static/css/reset.css" type="text/css" rel="stylesheet">
  <link href="./static/css/common.css" type="text/css" rel="stylesheet">
  <link href="./static/css/table.css" type="text/css" rel="stylesheet">
  <link href="./static/css/style-sub.css" type="text/css" rel="stylesheet">
  <link href="./static/css/modal.css" type="text/css" rel="stylesheet">
  <link href="./static/css/jquery-ui.css" type="text/css" rel="stylesheet">

  <!--libs-->
  <!--css-->
  <link href="./static/js/libs/swiper/swiper.min.css" type="text/css" rel="stylesheet">
  <link href="./static/js/libs/datepicker-master/dist/datepicker.min.css" type="text/css" rel="stylesheet">
  <!--js-->

  <script src="./static/js/libs/jquery-ui.js"></script>
  <script src="./static/js/libs/swiper/swiper.min.js"></script>

  <!--js-->

  <title>큐빅아이</title>
</head>
<!--회원가입: 기본정보-->

<body>
  <!--헤더-->
  <div id="Header" class="header-wrap"></div>
  <div class="visual-wrap">
    <div class="inner">
      <div class="visual">
        <h2 class="visual-tit">회원가입</h2>
      </div>
    </div>
  </div>

  <!--콘텐츠-->
  <main class="content-wrap join-finish" id="Main">
    <section class="section sec-1 bg-gray">
      <div class="inner">
        <div class="app-step">
          <ul class="step">
            <li>약관동의</li>
            <li>기본정보</li>
            <li class="active">가입완료</li>
          </ul>
        </div>

        <div class="column-box">
          <div class="img-box">
            <img src="./static/img/icon/finish.png" alt="이미지">
          </div>
          <h3 class="tit">큐빅아이 회원가입을 환영합니다!</h3>
          <p class="desc">
            <span class="br">큐빅아이 선정산 및 쇼핑몰 통합 서비스를 이용하기 위해서는 회원님이 운영 중인</span> 쇼핑몰을 등록해야 합니다<br>
            <br>
            쇼핑몰은 마이페이지 &gt; 쇼핑몰 추가 등록에서 등록 할 수 있습니다.
          </p>
          <div class="sub-tit-wrap mb-0">
            <h4 class="sub-tit sm">쇼핑몰 등록</h4>
          </div>
          <div class="table-r-border4  wid-100p">
            <div class="info-table type-2">
              <dl class="table-item flex-1">
                <dt class="table-dt">회원명</dt>
                <dd class="table-dd"></dd>
              </dl>
              <dl class=" table-item flex-1">
                <dt class="table-dt">큐빅아이 ID </dt>
                <dd class="table-dd"></dd>
              </dl>
            </div>
          </div>
          <p class="desc">쇼핑몰을 등록해 선정산 및 쇼핑몰 통합 서비스를 이용하세요.</p>
          <p class="desc">큐빅아이와 함께 더욱 성공적인 사업으로 <span class="inline">발전하시길 기원합니다.</span></p>
          <p class="desc">감사합니다.<br>
            큐빅아이
          </p>
        </div>
        <div class="btn-box txt-center">
          <a class="btn lg-btn btn-color2" href="#n">확인</a>
        </div>
      </div>
    </section>
  </main>
  <!--//콘텐츠wrap-->
  <!--페이지top-->
  <a class="page-top" href="#n" aria-label="pageTop"></a>
  <!--푸터-->
  <div class="footer-wrap" id="Footer"></div>
  <!--모바일 바닥 메뉴-->
  <div id="mobileGnb" class="mobile-gnb-wrap"></div>
