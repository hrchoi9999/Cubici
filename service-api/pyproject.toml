[project]
name = "cubici-service-api"
version = "0.1.0"
description = "Python backend for Cubici legacy service reproduction"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.138.1",
  "pydantic>=2.13.4",
  "psycopg>=3.3.4",
  "python-multipart>=0.0.32",
  "httpx2>=0.28.1",
  "uvicorn[standard]>=0.38.0",
  "openpyxl>=3.1.5",
]

[project.scripts]
cubici-api = "cubici_service.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "db_e2e: local PostgreSQL end-to-end tests",
]
