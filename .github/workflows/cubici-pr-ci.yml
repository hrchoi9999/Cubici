name: Cubici PR CI

on:
  pull_request:
    branches:
      - devCubici
  workflow_dispatch:

permissions:
  contents: read

env:
  CUBICI_DB_HOST: 127.0.0.1
  CUBICI_DB_PORT: "5432"
  CUBICI_DB_NAME: cubici_ci
  CUBICI_DB_USER: cubici_ci
  CUBICI_DB_PASSWORD: cubici_ci_password
  CUBICI_DB_SCHEMA: public
  CUBICI_AUTH_SECRET: ci-auth-secret-not-for-production
  CUBICI_MASTER_ADMIN_EMAIL: master-admin@example.test
  CUBICI_MASTER_ADMIN_PASSWORD: ci-master-admin-password
  VITE_CUBICI_MASTER_ADMIN_EMAIL: master-admin@example.test
  VITE_API_BASE_URL: http://127.0.0.1:8000
  CUBICI_CORS_ALLOW_ORIGINS: http://127.0.0.1:4173,http://127.0.0.1:4175
  CUBICI_EXTERNAL_API_ENABLED: "false"
  PYTHONPATH: service-api/src

jobs:
  service-api:
    name: service-api tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cubici_ci
          POSTGRES_USER: cubici_ci
          POSTGRES_PASSWORD: cubici_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cubici_ci -d cubici_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi "pydantic>=2.13.4" "psycopg[binary]>=3.3.4" python-multipart "uvicorn[standard]>=0.38.0" httpx

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply database schema and CI seed
        run: python scripts/ci/apply_postgres_schema.py

      - name: Run service-api non-DB tests
        env:
          CUBICI_RUN_DB_E2E: "0"
        run: python -m pytest service-api/tests -k "not db_e2e and not e2e"

      - name: Run service-api DB-included tests
        env:
          CUBICI_RUN_DB_E2E: "1"
        run: python -m pytest service-api/tests

  frontend:
    name: frontend build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install admin-web dependencies
        working-directory: admin-web
        run: npm install

      - name: Install user-web dependencies
        working-directory: user-web
        run: npm install

      - name: Build admin-web
        working-directory: admin-web
        run: npm run build

      - name: Build user-web
        working-directory: user-web
        run: npm run build

      - name: Build Cloudflare static bundle
        run: node scripts/build-cloudflare-static-bundle.mjs

      - name: DB-free UI smoke
        run: node scripts/smoke-cloudflare-static-bundle.mjs

      - name: Git diff check
        run: git diff --check

  ui-db-e2e:
    name: focused DB-gated UI E2E
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.downloads/ms-playwright
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cubici_ci
          POSTGRES_USER: cubici_ci
          POSTGRES_PASSWORD: cubici_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cubici_ci -d cubici_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi "pydantic>=2.13.4" "psycopg[binary]>=3.3.4" python-multipart "uvicorn[standard]>=0.38.0" httpx

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install admin-web dependencies
        working-directory: admin-web
        run: npm install

      - name: Install user-web dependencies
        working-directory: user-web
        run: npm install

      - name: Install Playwright Chromium
        working-directory: admin-web
        run: npx playwright install --with-deps chromium

      - name: Apply database schema and CI seed
        run: python scripts/ci/apply_postgres_schema.py

      - name: Run focused admin DB-gated E2E
        env:
          CUBICI_RUN_DB_E2E: "1"
          CUBICI_PYTHON_EXE: python
          CUBICI_API_E2E_PORT: "8010"
          CUBICI_E2E_PORT: "4173"
          CUBICI_USER_E2E_PORT: "4175"
          CUBICI_API_BASE_URL: http://127.0.0.1:8010
          VITE_API_BASE_URL: http://127.0.0.1:8010
          CUBICI_CORS_ALLOW_ORIGINS: http://127.0.0.1:4173,http://127.0.0.1:4175
          CUBICI_CORS_ALLOW_ORIGIN_REGEX: "https?://(127\\.0\\.0\\.1|localhost):\\d+"
        run: |
          node admin-web/scripts/run-playwright-e2e.mjs \
            tests/e2e/admin-master-auth-focused.spec.js \
            tests/e2e/admin-preferences-crud-db-e2e.spec.js \
            tests/e2e/admin-support-crud-db-e2e.spec.js

      - name: Run focused user DB-gated E2E
        env:
          CUBICI_RUN_DB_E2E: "1"
          CUBICI_PYTHON_EXE: python
          CUBICI_API_E2E_PORT: "8011"
          CUBICI_USER_E2E_PORT: "4176"
          CUBICI_API_BASE_URL: http://127.0.0.1:8011
          VITE_API_BASE_URL: http://127.0.0.1:8011
        run: |
          node user-web/scripts/run-playwright-e2e.mjs \
            tests/e2e/commerce-sales-settlement-db-e2e.spec.js
